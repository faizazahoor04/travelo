<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Travelo</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="auth.css">
    
    <style>
        .hero-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(10, 28, 47, 0.45), rgba(28, 58, 79, 0.65)),
                              url('https://images.unsplash.com/photo-1519904981063-b0cf448d479e?q=80&w=2070');
            /* More attractive alternative options (uncomment one):
               url('https://picsum.photos/id/1015/2000/1200') 
               url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80&w=2070')
            */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            z-index: -1;
        }

        .dashboard-content {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem 1rem;
            color: white;
        }

        .dashboard-content h1 {
            font-size: 3.6rem;
            font-weight: 800;
            text-shadow: 0 6px 25px rgba(0, 0, 0, 0.5);
            margin-bottom: 1rem;
            line-height: 1.1;
        }

        .dashboard-content p {
            font-size: 1.55rem;
            max-width: 700px;
            opacity: 0.95;
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.6);
            margin-bottom: 3.5rem;
            line-height: 1.45;
        }

        /* Unified Glass-style Buttons - Same Size */
        .btn-glass {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 600;
            padding: 1.4rem 3.8rem;
            border-radius: 60px;
            text-decoration: none;
            transition: all 0.4s ease;
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.35);
            min-width: 300px;
            justify-content: center;
            margin: 0.6rem;
        }

        .btn-primary-glass {
            background: var(--clr-accent);
            color: white;
            box-shadow: var(--btn-shadow);
        }

        .btn-primary-glass:hover {
            transform: translateY(-6px);
            box-shadow: var(--btn-shadow-hover);
            background: var(--clr-accent-soft);
        }

        .btn-logout-glass {
            background: rgba(255, 255, 255, 0.18);
            color: white;
        }

        .btn-logout-glass:hover {
            background: rgba(255, 255, 255, 0.28);
            border-color: #E27E5E;
            color: #ffd4b3;
            transform: translateY(-4px);
        }
    </style>
</head>
<body>

    <!-- Beautiful Misty Mountain Background -->
    <div class="hero-background"></div>

    <header class="header" id="header">
        <div class="container nav-container">
            <a href="dashboard.html" class="logo">
                <i class="fa-solid fa-compass"></i> Travelo
            </a>
        </div>
    </header>

    <main class="auth-page">
        <div class="dashboard-content">
            <h1>Welcome back, Explorer! ✧</h1>
            <p>Your AI travel assistant is ready. Let's find your next unforgettable destination.</p>
            
            <a href="index.html" class="btn-glass btn-primary-glass">
                Start New Trip 
                <i class="fa-solid fa-arrow-right"></i>
            </a>
            
            <a href="login.html" class="btn-glass btn-logout-glass">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </a>
        </div>
    </main>

    <script src="auth.js"></script>
</body>
</html>
