<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Travelo · AI Pakistan Travel Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Premium, distinctive palette — deep indigo, warm amber, subtle clay */
            --clr-primary: #0A1C2F;      /* deep navy indigo */
            --clr-primary-light: #1B2F44;
            --clr-secondary: #D9C5A7;    /* warm sand / parchment */
            --clr-accent: #C75C3C;       /* terracotta clay */
            --clr-accent-soft: #E27E5E;
            --clr-bg-main: #F6F3EE;      /* natural linen */
            --clr-bg-card: #FFFFFF;
            --clr-text-main: #2D3F44;    /* deep sage-gray */
            --clr-text-heading: #0A1C2F;
            --clr-text-muted: #6B7A6E;
            --clr-border-light: #E9E2D6;
            
            /* Unified button shadow token */
            --btn-shadow: 0 8px 18px -6px rgba(0, 0, 0, 0.12), 0 2px 4px -2px rgba(0, 0, 0, 0.02);
            --btn-shadow-hover: 0 12px 24px -10px rgba(199, 92, 60, 0.28), 0 4px 8px -4px rgba(0, 0, 0, 0.1);
            
            --font-main: 'Inter', system-ui, -apple-system, sans-serif;
            --container-max: 1280px;
            --radius-sm: 8px;
            --radius-md: 20px;
            --radius-lg: 32px;
            --transition-smooth: 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        body {
            font-family: var(--font-main);
            background: var(--clr-bg-main);
            color: var(--clr-text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            margin: 0;
        }

        /* main card container */
        .travelo-card {
            max-width: 780px;
            width: 100%;
            background: var(--clr-bg-card);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 40px -12px rgba(10, 28, 47, 0.18), 0 4px 12px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            transition: var(--transition-smooth);
            backdrop-filter: blur(0px);
            border: 1px solid var(--clr-border-light);
        }

        /* header with Travelo branding */
        .travelo-header {
            background: var(--clr-primary);
            padding: 24px 28px;
            color: white;
            border-bottom: 3px solid var(--clr-accent);
        }

        .travelo-header h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
        }

        .travelo-header h1 span {
            background: var(--clr-accent);
            font-size: 1.2rem;
            padding: 4px 12px;
            border-radius: 60px;
            font-weight: 500;
        }

        .travelo-header p {
            font-size: 0.9rem;
            margin-top: 10px;
            opacity: 0.85;
            color: var(--clr-secondary);
            font-weight: 400;
        }

        /* chat area */
        .chat-area {
            height: 460px;
            overflow-y: auto;
            padding: 24px 20px;
            background: var(--clr-bg-main);
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        /* message bubbles */
        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 24px;
            font-size: 0.95rem;
            line-height: 1.45;
            animation: fadeSlideUp 0.25s ease;
            word-wrap: break-word;
            box-shadow: 0 1px 1px rgba(0,0,0,0.02);
        }

        .user-message {
            background: var(--clr-primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            margin-left: auto;
        }

        .bot-message {
            background: white;
            color: var(--clr-text-main);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            border: 1px solid var(--clr-border-light);
            box-shadow: var(--btn-shadow);
        }

        .typing-indicator {
            background: white;
            align-self: flex-start;
            border-radius: 24px;
            padding: 10px 18px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--clr-text-muted);
            font-size: 0.85rem;
            border: 1px solid var(--clr-border-light);
        }

        .typing-indicator .dot {
            width: 7px;
            height: 7px;
            background: var(--clr-accent);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.2s infinite ease-in-out;
        }

        .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 60%, 100% { transform: scale(0.6); opacity: 0.5; }
            30% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* input bar */
        .input-bar {
            background: var(--clr-bg-card);
            border-top: 1px solid var(--clr-border-light);
            padding: 18px 22px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .input-bar input {
            flex: 1;
            background: #FEFCF8;
            border: 1px solid var(--clr-border-light);
            border-radius: 60px;
            padding: 14px 20px;
            font-family: var(--font-main);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition-smooth);
            color: var(--clr-text-heading);
        }

        .input-bar input:focus {
            border-color: var(--clr-accent);
            box-shadow: 0 0 0 3px rgba(199, 92, 60, 0.2);
        }

        .btn {
            font-family: var(--font-main);
            font-weight: 600;
            border: none;
            background: var(--clr-accent);
            color: white;
            padding: 10px 24px;
            border-radius: 60px;
            cursor: pointer;
            transition: var(--transition-smooth);
            font-size: 0.9rem;
            box-shadow: var(--btn-shadow);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--clr-accent);
        }

        .btn-primary:hover {
            background: var(--clr-accent-soft);
            transform: scale(0.97);
            box-shadow: var(--btn-shadow-hover);
        }

        .btn-reset {
            background: var(--clr-primary-light);
            border: 1px solid rgba(255,255,255,0.15);
        }

        .btn-reset:hover {
            background: var(--clr-primary);
            transform: scale(0.97);
        }

        @media (max-width: 550px) {
            .travelo-header h1 { font-size: 1.5rem; }
            .message { max-width: 90%; }
            .input-bar { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
            .input-bar input { width: 100%; }
        }
    </style>
</head>
<body>
<div class="travelo-card">
    <div class="travelo-header">
        <h1>✈️ Travelo <span>AI</span></h1>
        <p>Your intelligent companion for unforgettable journeys across Pakistan.</p>
    </div>
    <div class="chat-area" id="chatMessages">
        <!-- dynamic messages -->
    </div>
    <div class="input-bar">
        <input type="text" id="userInput" placeholder="Type your answer... (Cool mountains, Low budget, etc.)" autocomplete="off">
        <button class="btn btn-primary" id="sendBtn">➤ Send</button>
        <button class="btn btn-reset" id="resetBtn">↻ New Trip</button>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // PAKISTAN DESTINATION DATABASE (weather + budget)
    // --------------------------------------------------------------
    const destinationsDB = {
        cool: {
            low: "❄️ Naran, Kaghan, or Ayubia – perfect for cool mountains on a low budget (cozy guesthouses, local transport).",
            medium: "🏔️ Murree, Bhurban, or Malam Jabba – comfortable hotels, chairlifts, and pine-scented views.",
            high: "🏞️ Hunza Valley, Skardu, or Shogran – stunning landscapes with nice resorts & flights from Islamabad.",
            luxury: "🌟 Fairy Meadows luxury camping, Serena Hotels in Swat, or PC Malam Jabba – world‑class mountain escape."
        },
        hot: {
            low: "☀️ Karachi (Clifton beach, street food), Thatta, or Sukkur – warm weather, authentic culture, low cost.",
            medium: "🌊 Gwadar, Makran Coastal Highway, or Rann of Kutch – emerging tourism with great mid‑range stays.",
            high: "🏜️ Moola Chotok, Daulatpur, or Mohenjo Daro with private guide – hot but extraordinary.",
            luxury: "✨ Pearl Continental Gwadar, Kund Malir beach glamping, Zaver Pearl Continental Hyderabad."
        },
        moderate: {
            low: "🏛️ Lahore (Food street, Badshahi Mosque) or Multan (tombs & bazaars) – pleasant weather, rich heritage.",
            medium: "🌿 Islamabad (Trail 5, Faisal Mosque) or Peshawar (Qissa Khwani Bazaar) – cultural & green.",
            high: "👑 Bahawalpur (Noor Mahal, Lal Suhanra safari) or Taxila museum with luxury bus tour.",
            luxury: "🧡 Serena Islamabad, PC Rawalpindi, or restored havelis in Multan – royal comfort."
        },
        rainy: {
            low: "🍃 Leepa Valley (Kashmir) or Nathia Gali (monsoon walks) – lush green, charming, budget-friendly.",
            medium: "💧 Shogran or Ratti Gali Lake – rainy season magic with moderate expense.",
            high: "🌧️ Neelum Valley (Arang Kel) or Kel to Shounter Valley – spectacular monsoon greenery.",
            luxury: "🎣 Trout fishing cottages in Kalam or exclusive resort in Jhelum Valley – premium rainy retreat."
        }
    };

    // ------------------- Conversation state machine -------------------
    let step = "greeting";     // greeting -> askWeather -> askBudget -> suggest -> thankYou -> done
    let userWeather = null;    // "cool", "hot", "moderate", "rainy"
    let userBudget = null;     // "low", "medium", "high", "luxury"

    // DOM elements
    const chatContainer = document.getElementById("chatMessages");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const resetBtn = document.getElementById("resetBtn");

    // Helper: scroll to bottom
    function scrollToBottom() {
        chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: "smooth" });
    }

    // Add a plain message (user or bot)
    function addMessage(text, isUser = false) {
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${isUser ? "user-message" : "bot-message"}`;
        msgDiv.innerText = text;
        chatContainer.appendChild(msgDiv);
        scrollToBottom();
    }

    // Show elegant typing animation (three dots)
    async function showTyping(durationMs = 700) {
        const typingDiv = document.createElement("div");
        typingDiv.className = "typing-indicator";
        typingDiv.innerHTML = `<span>Travelo is thinking</span><span class="dot"></span><span class="dot"></span><span class="dot"></span>`;
        chatContainer.appendChild(typingDiv);
        scrollToBottom();
        await new Promise(resolve => setTimeout(resolve, durationMs));
        typingDiv.remove();
    }

    // Bot reply with typing effect
    async function botReply(text, delay = 500) {
        await showTyping(550);
        addMessage(text, false);
    }

    // Question wrappers
    async function askWeatherQuestion() {
        await botReply("Which weather do you prefer? (Cool mountains, Hot sunny, Moderate pleasant, Rainy green)", 300);
        step = "askWeather";
    }

    async function askBudgetQuestion() {
        await botReply("What’s your budget per person? (Low: <20k PKR, Medium: 20k-60k, High: 60k-150k, Luxury: >150k PKR)", 300);
        step = "askBudget";
    }

    async function sendThankYou() {
        await botReply("Thank you for using Travelo! Have an unforgettable journey through Pakistan. Come back anytime for more recommendations! ", 400);
        step = "done";
    }

    // Core suggestion logic
    async function generateSuggestionAndFinish() {
        if (!userWeather || !userBudget) {
            // fallback: safety reset?
            await botReply("Oops, I lost track. Let’s restart your journey with Travelo.");
            resetConversation();
            return;
        }
        const suggestion = destinationsDB[userWeather]?.[userBudget];
        let suggestionText = "";
        if (suggestion) {
            suggestionText = ` Based on your ${userWeather} weather preference and ${userBudget} budget, I recommend:\n\n${suggestion}`;
        } else {
            suggestionText = ` I couldn’t find an exact match for ${userWeather} weather + ${userBudget} budget. The closest option might be: ${destinationsDB[userWeather]?.medium || "a beautiful spot like Naran or Lahore – but you may need to adjust budget slightly."}`;
        }
        await botReply(suggestionText, 500);
        await sendThankYou();
    }

    // Process user input (rule-based state machine)
    async function processUserInput(rawInput) {
        const trimmed = rawInput.trim().toLowerCase();
        if (!trimmed) return;

        // State machine
        if (step === "greeting") {
            // After reset it should not hit, but just in case:
            step = "askWeather";
            await askWeatherQuestion();
            return;
        }

        if (step === "askWeather") {
            let mappedWeather = null;
            if (trimmed.includes("cool") || trimmed.includes("mountain") || trimmed.includes("cold") || trimmed.includes("northern")) mappedWeather = "cool";
            else if (trimmed.includes("hot") || trimmed.includes("sunny") || trimmed.includes("desert") || trimmed.includes("beach") || trimmed.includes("coastal")) mappedWeather = "hot";
            else if (trimmed.includes("moderate") || trimmed.includes("pleasant") || trimmed.includes("plain") || trimmed.includes("city")) mappedWeather = "moderate";
            else if (trimmed.includes("rain") || trimmed.includes("monsoon") || trimmed.includes("green") || trimmed.includes("lush") || trimmed.includes("valley")) mappedWeather = "rainy";
            
            if (!mappedWeather) {
                await botReply("Hmm, let me understand. Please choose exactly: Cool mountains, Hot sunny, Moderate pleasant, or Rainy green.");
                return;
            }
            userWeather = mappedWeather;
            await botReply(`Got it! You prefer ${mappedWeather} weather. Now, let's talk about budget.`);
            setTimeout(() => askBudgetQuestion(), 500);
            step = "askBudget";
            return;
        }

        if (step === "askBudget") {
            let mappedBudget = null;
            if (trimmed.includes("low") || trimmed.includes("<20k") || trimmed.includes("under 20") || trimmed.includes("20k")) mappedBudget = "low";
            else if (trimmed.includes("medium") || trimmed.includes("mid") || (trimmed.includes("20") && trimmed.includes("60"))) mappedBudget = "medium";
            else if (trimmed.includes("high") || trimmed.includes("60k") || trimmed.includes("150k") || (trimmed.includes("60") && trimmed.includes("150"))) mappedBudget = "high";
            else if (trimmed.includes("luxury") || trimmed.includes(">150") || trimmed.includes("150+") || trimmed.includes("premium")) mappedBudget = "luxury";
            
            if (!mappedBudget) {
                await botReply("Please share your budget clearly: Low (<20k PKR), Medium (20k-60k), High (60k-150k), or Luxury (>150k PKR).");
                return;
            }
            userBudget = mappedBudget;
            // Move to suggestion step
            await generateSuggestionAndFinish();
            step = "thankYou"; // after suggestion, thank you will be sent inside function, then step becomes "done"
            return;
        }

        // If conversation is done (step === "done" or "thankYou")
        if (step === "done" || step === "thankYou") {
            await botReply("Your journey planning is complete! Press the 'New Trip' button to discover another destination in Pakistan. Safe travels! 🌄");
            return;
        }
    }

    // ---------- Reset everything ----------
    function resetConversation() {
        // clear chat UI
        chatContainer.innerHTML = "";
        // reset state variables
        step = "greeting";
        userWeather = null;
        userBudget = null;

        // Greeting message
        addMessage("Hello! I'm Travelo AI your Pakistan travel specialist. Let's uncover your next unforgettable destination.", false);
        // after short delay, ask weather
        setTimeout(async () => {
            if (step === "greeting") {
                await askWeatherQuestion();
            }
        }, 600);
    }

    // send message handler
    async function handleSendMessage() {
        const userMsg = userInput.value.trim();
        if (userMsg === "") return;
        addMessage(userMsg, true);
        userInput.value = "";
        await processUserInput(userMsg);
    }

    // Event listeners
    sendBtn.addEventListener("click", handleSendMessage);
    resetBtn.addEventListener("click", () => resetConversation());
    userInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") handleSendMessage();
    });

    // Initialize the assistant on page load
    resetConversation();
</script>
</body>
</html>
