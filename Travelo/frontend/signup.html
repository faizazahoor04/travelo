<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Travelo</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <header class="header" id="header">
        <div class="container nav-container">
            <a href="dashboard.html" class="logo">
                <i class="fa-solid fa-compass"></i> Travelo
            </a>
        </div>
    </header>

    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <h1>Join the journey</h1>
                <p class="auth-subtitle">Create your account in seconds</p>

                <div id="flash-message"></div>

                <form id="signup-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" required placeholder="Alex Rivera">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" required placeholder="you@email.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Create Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" required>
                            <button type="button" class="toggle-password"><i class="fa-solid fa-eye"></i></button>
                        </div>
                        <div class="strength-container">
                            <div class="strength-meter"><div id="strength-bar" class="strength-bar"></div></div>
                            <small id="strength-text" class="strength-text">Password strength</small>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">Confirm Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirm_password" required>
                            <button type="button" class="toggle-password"><i class="fa-solid fa-eye"></i></button>
                        </div>
                    </div>

                    <button type="submit" onclick="signup()" class="btn btn-primary full-width">Create Account <i class="fa-solid fa-arrow-right"></i></button>
                </form>

                <p class="switch-auth">
                    Already have an account? <a href="login.html">Sign in</a>
                </p>
            </div>
        </div>
    </main>

    <script src="auth.js"></script>
    <script>
        // Demo signup
        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;

            if (password !== confirm) {
                showFlash('Passwords do not match.', 'error');
                return;
            }
            if (password.length < 8) {
                showFlash('Password must be at least 8 characters long.', 'error');
                return;
            }

            showFlash('Account created successfully!', 'success');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        });

        function showFlash(message, type) {
            const flash = document.getElementById('flash-message');
            flash.innerHTML = `<div class="flash ${type}">${message}</div>`;
        }
    </script>
</body>
</html>
