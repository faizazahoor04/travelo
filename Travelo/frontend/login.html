<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Travelo</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <header class="header" id="header">
        <div class="container nav-container">
            <a href="dashboard.html" class="logo">
                <i class="fa-solid fa-compass"></i> Travelo
            </a>
        </div>
    </header>

    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <h1>Welcome back</h1>
                <p class="auth-subtitle">Sign in to continue your journey</p>

                <div id="flash-message"></div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" required placeholder="you@email.com" autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" required autocomplete="current-password">
                            <button type="button" class="toggle-password"><i class="fa-solid fa-eye"></i></button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>
                    <br>
                    <button type="submit" onclick="login()" class="btn btn-primary full-width">Sign In <i class="fa-solid fa-arrow-right"></i></button>
                </form>

                <div class="auth-divider"><span>or continue with</span></div>

                <div class="social-logins">
                    <button class="social-btn"><i class="fa-brands fa-google"></i> Google</button>
                    <button class="social-btn"><i class="fa-brands fa-apple"></i> Apple</button>
                </div>

                <p class="switch-auth">
                    New to Travelo? <a href="signup.html">Create account</a>
                </p>
            </div>
        </div>
    </main>

    <script src="auth.js"></script>
    <script>
        // Demo login
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            
            if (email) {
                showFlash('Welcome back! Login successful.', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1200);
            }
        });

        function showFlash(message, type) {
            const flash = document.getElementById('flash-message');
            flash.innerHTML = `<div class="flash ${type}">${message}</div>`;
        }
    </script>
</body>
</html>
